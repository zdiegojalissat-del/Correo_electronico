<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Suscripción</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      width: 350px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      transition: 0.3s;
    }

    input[type="email"]:focus {
      border-color: #667eea;
      outline: none;
      box-shadow: 0px 0px 8px rgba(102,126,234,0.5);
    }

    input:invalid {
      border-color: red;
    }

    .checkbox {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
      transform: scale(1.03);
    }

    #mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Suscripción</h1>

    <form id="formulario">

      <label for="correo">
        Correo electrónico
      </label>

      <input
      type="email"
      id="correo"
      placeholder="ejemplo@gmail.com"
      required>

      <div class="checkbox">

        <input
        type="checkbox"
        id="terminos"
        required>

        <label for="terminos">
          Acepto términos y condiciones
        </label>

      </div>

      <button type="submit">
        Suscribirse
      </button>

      <p id="mensaje"></p>

    </form>

  </div>

  <script>

    document.getElementById("formulario")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      let correo =
      document.getElementById("correo").value;

      let mensaje =
      document.getElementById("mensaje");

      let regex =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if(regex.test(correo)) {

        mensaje.textContent =
        "✅ Suscripción realizada correctamente";

        mensaje.style.color = "green";

      } else {

        mensaje.textContent =
        "❌ Correo electrónico inválido";

        mensaje.style.color = "red";
      }

    });

  </script>

</body>
</html>
